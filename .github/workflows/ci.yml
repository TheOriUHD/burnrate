name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: python -m unittest discover -s tests -v
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install.ps1 (install, update, check, uninstall)
        shell: pwsh
        run: |
          ./install.ps1 -Source . -NoAutostart -Port 18090
          ./install.ps1 -Source . -NoAutostart -Port 18090
          (Invoke-WebRequest http://127.0.0.1:18090/app.js).Headers["Content-Type"]
          Invoke-RestMethod http://127.0.0.1:18090/api/providers | Out-Null
          ./install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Burnrate\venv") { throw "venv left behind" }
  install-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install.sh (install, update, check, uninstall)
        run: |
          sh install.sh --source . --no-autostart --port 18090
          sh install.sh --source . --no-autostart --port 18090
          curl -fsS http://127.0.0.1:18090/healthz
          sh install.sh --uninstall
  image:
    needs: [test, install-windows, install-unix]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
